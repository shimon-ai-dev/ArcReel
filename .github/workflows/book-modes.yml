name: Book modes

on:
  push:
    branches: [feat/book-output-modes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Book backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Book workflow syntax and shell check
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color .github/workflows/book-modes.yml

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint and format
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .

      - name: Type check
        run: uv run --frozen basedpyright --warnings

      - name: Import layering
        run: uv run --frozen lint-imports

      - name: Dependency hygiene
        run: uv run --frozen deptry lib server alembic scripts tests

      - name: Repository and test conventions
        run: |
          uv run --frozen python scripts/audit_conventions.py --check
          uv run --frozen python scripts/audit_tests.py --check
          uv run --frozen python scripts/lint_agent_runtime_profile.py

      - name: Book unit and integration tests (mocked model calls)
        # Explicit selection excludes video tests and live-model e2e tests.
        run: >-
          uv run --frozen python -m pytest
          tests/unit/lib/book
          tests/unit/lib/book_audio
          tests/integration/lib/book_audio
          tests/integration/server/services/book
          tests/integration/server/routers/test_books.py
          tests/unit/server/test_book_tools.py
          tests/unit/lib/script/test_book_annotations.py
          tests/integration/server/agent_toolset/test_text_generation.py
          tests/integration/lib/workflow/test_workflow_state.py
          tests/unit/lib/workflow/test_workflow_plan.py
          tests/unit/lib/library_bundle
          tests/unit/lib/project/test_library_import.py
          tests/unit/server/routers/test_library_import_router.py
          tests/unit/lib/references/test_reference_admission.py
          tests/unit/lib/artifacts/test_generation_input.py
          tests/unit/lib/prompts/test_reference_image_numbering.py
          tests/unit/lib/custom_provider/comfyui/test_comfyui_image_backend.py
          -q

  frontend:
    name: Book frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Dependency hygiene
        run: pnpm knip

      - name: Build
        run: pnpm build

      - name: Book component tests
        # Do not use pnpm check or the full video-oriented e2e suite here.
        run: >-
          pnpm exec vitest run
          src/components/book/*.test.ts
          src/components/book/*.test.tsx
          src/components/pages/CreateBookProjectModal.test.tsx
          src/components/canvas/lorebook/ExternalLibraryImportDialog.test.tsx
          src/components/canvas/lorebook/ExternalLibraryMetadata.test.tsx
          src/components/canvas/lorebook/library-import-files.test.ts
          src/router.test.tsx
          src/components/canvas/StudioCanvasRouter.test.tsx

      - name: Install Chromium for shared Studio acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify original Studio book workflows (fixture APIs only)
        run: pnpm exec playwright test --config playwright.book.config.ts

      - name: Upload shared Studio screenshots and traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: book-workflow-ui-evidence
          path: |
            frontend/test-results/book-workflow
            frontend/book-workflow-report
          if-no-files-found: warn
          retention-days: 14

  portable-player:
    name: Illustrated book Chromium smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install locked dependencies
        run: |
          uv sync --frozen
          pnpm --dir frontend install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify portable illustrated player
        # Sine-wave audio and solid-color images only; no external models or API keys.
        run: |
          archive=$(uv run --frozen python scripts/book/make_fixture.py "$RUNNER_TEMP/book-fixture")
          uv run --frozen python -m zipfile -e "$archive" "$RUNNER_TEMP/book-player"
          node scripts/book/check_player.mjs "$RUNNER_TEMP/book-player/index.html"
